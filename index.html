<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Directory Application</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link href="./dist/output.css" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 30px 20px;
      background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
      min-height: 100vh;
      color: #2d3748;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 15px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      margin-bottom: 30px;
      border-left: 6px solid #4f46e5;
    }

    header img {
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
    }

    header h1 {
      font-size: 24px;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      
      margin: 0;
      font-weight: 700;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-left: auto;
    }

    nav a {
      text-decoration: none;
      color: #4f46e5;
      font-weight: 600;
      transition: color 0.3s ease;
      padding: 5px 10px;
      border-radius: 8px;
    }

    nav a:hover {
      color: #7c3aed;
      background: #f3f4f6;
    }

    section {
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      margin-bottom: 30px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
      color: #1e293b;
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }
    
    h2::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
      border-radius: 2px;
    }

    #search-form {
      display: flex;
      gap: 20px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 220px;
    }

    .form-group label {
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
      color: #475569;
    }

    .form-group input, 
    .form-group select {
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-group input:focus, 
    .form-group select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
    }

    button {
      padding: 12px 28px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      font-family: inherit;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      transition: all 0.3s ease;
      height: 48px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.45);
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #f1f5f9;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #4f46e5, #06b6d4);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 25px rgba(79, 70, 229, 0.15);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #1e293b;
      font-size: 18px;
    }

    .card p {
      margin: 8px 0;
      font-size: 14px;
      color: #64748b;
    }

    .card strong {
      color: #334155;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo" width="42">
    <h1>User Management Portal</h1>
    <div class="nav-group">
      <nav>
        <a href="#">Home</a> | <a href="#">Users</a>
      </nav>
    </div>
  </header>
  <main>
    <section>
      <form id="search-form">
        <div class="form-group">
          <label for="search-input">Search by Name:</label>
          <input type="text" id="search-input" placeholder="Enter name...">
        </div>
        <div class="form-group">
          <label for="filter-select">Account Status:</label>
          <select id="filter-select">
            <option value="All">All</option>
          </select>
        </div>
        <button type="submit">Search</button>
      </form>
    </section>

    <section>
      <h2>Users List</h2>
      <div id="users-list" class="cards-container"></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
